# Start AeroSpace at login
start-at-login = true

# Normalization settings
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion layout settings
accordion-padding = 30

# Default root container settings
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus settings
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Automatically unhide macOS hidden apps
automatically-unhide-macos-hidden-apps = true

# Key mapping preset
[key-mapping]
preset = 'qwerty'

# Gaps settings
[gaps]
inner.horizontal = 6
inner.vertical =   6
outer.left =       6
outer.bottom =     6
outer.top =        6
outer.right =      6

# Main mode bindings
# Kept in sync with home-manager/modules/hyprland.nix (mod = ALT).
[mode.main.binding]
# Switch themes (hyprland: ALT+CTRL+N)
ctrl-alt-n = 'exec-and-forget /run/current-system/sw/bin/zsh -c apply-theme'

# Launch applications
alt-shift-enter = 'exec-and-forget /run/current-system/sw/bin/zsh -c kitty'
alt-shift-f = 'exec-and-forget open -a Finder'

# Launcher (hyprland: ALT+D) — Spotlight stands in for rofi/quickshell
alt-d = "exec-and-forget osascript -e 'tell application \"System Events\" to key code 49 using command down'"

# Clipboard history (hyprland: ALT+V -> copyq)
alt-v = 'exec-and-forget open -a Maccy'

# Emoji picker (hyprland: ALT+period -> rofimoji)
alt-period = "exec-and-forget osascript -e 'tell application \"System Events\" to key code 49 using {control down, command down}'"

# Lock screen (hyprland: ALT+SHIFT+L -> hyprlock)
alt-shift-l = "exec-and-forget osascript -e 'tell application \"System Events\" to keystroke \"q\" using {command down, control down}'"

# Reload config (hyprland: ALT+SHIFT+R)
alt-shift-r = 'reload-config'

# Window management
alt-shift-q = 'close'
alt-f = 'fullscreen'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus movement
ctrl-shift-h = 'focus left'
ctrl-shift-j = 'focus down'
ctrl-shift-k = 'focus up'
ctrl-shift-l = 'focus right'

# Window movement
alt-ctrl-h = 'move left'
alt-ctrl-j = 'move down'
alt-ctrl-k = 'move up'
alt-ctrl-l = 'move right'

# Resize windows (h/l on the parent axis, k/j on the opposite — matches hyprland resizeactive)
ctrl-alt-shift-h = 'resize smart -50'
ctrl-alt-shift-l = 'resize smart +50'
ctrl-alt-shift-k = 'resize smart-opposite -50'
ctrl-alt-shift-j = 'resize smart-opposite +50'

# Workspace management
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move windows to workspaces
alt-shift-1 = [ 'move-node-to-workspace 1', 'workspace 1' ]
alt-shift-2 = [ 'move-node-to-workspace 2', 'workspace 2' ]
alt-shift-3 = [ 'move-node-to-workspace 3', 'workspace 3' ]
alt-shift-4 = [ 'move-node-to-workspace 4', 'workspace 4' ]
alt-shift-5 = [ 'move-node-to-workspace 5', 'workspace 5' ]
alt-shift-6 = [ 'move-node-to-workspace 6', 'workspace 6' ]
alt-shift-7 = [ 'move-node-to-workspace 7', 'workspace 7' ]
alt-shift-8 = [ 'move-node-to-workspace 8', 'workspace 8' ]
alt-shift-9 = [ 'move-node-to-workspace 9', 'workspace 9' ]
alt-shift-0 = [ 'move-node-to-workspace 10', 'workspace 10' ]

# Window cycling (hyprland: ALT+TAB / ALT+SHIFT+TAB)
alt-tab = 'focus dfs-next --boundaries workspace --boundaries-action wrap-around-the-workspace'
alt-shift-tab = 'focus dfs-prev --boundaries workspace --boundaries-action wrap-around-the-workspace'

# macOS-only extras: no hyprland counterpart
alt-backtick = 'workspace-back-and-forth'
alt-shift-m = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode
alt-shift-semicolon = 'mode service'

# Service mode bindings
[mode.service.binding]
# Reload config and exit service mode
esc = ['reload-config', 'mode main']

# Reset layout
r = ['flatten-workspace-tree', 'mode main']

# Toggle floating/tiling layout
f = ['layout floating tiling', 'mode main']

# Close all windows but current
backspace = ['close-all-windows-but-current', 'mode main']

# Join with adjacent windows
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[mode.vnc.binding]
ctrl-alt-esc = 'mode main'

# Window detection rules — mirrors hyprland exec-once workspace placement
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 10'

[[on-window-detected]]
if.app-id = 'org.turbovnc.vncviewer'
run = 'layout floating'
