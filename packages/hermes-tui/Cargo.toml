[package]
name = "hermes-tui"
version = "2.1.0"
edition = "2021"
description = "Hermes terminal client: conversations, tracked threads and live jobs"
license = "MIT"
publish = false

[[bin]]
name = "hermes-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "3.3", default-features = false, features = [
  "gzip",
  "json",
  "rustls",
] }

[profile.release]
lto = true
strip = true
